<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>OmniPost 계정 연결</title>
<style>
  :root { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; } }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; line-height: 1.6; }
  p { color: var(--muted); }
</style>
</head>
<body>
<h2>계정 연결 중…</h2>
<p id="msg">이 PC의 OmniPost 업로드 프로그램으로 넘어가는 중이에요. 업로드 프로그램이 켜져 있어야 해요.</p>
<script>
  // 모든 SNS(Threads, Instagram, Facebook, YouTube, TikTok, X) 공용 연결 페이지.
  // SNS 에서 '허용' 후 돌아온 값(code, state 등)을 이 PC 의 업로드 프로그램(127.0.0.1:3001)으로 그대로 넘긴다.
  // 이 페이지는 아무 데이터도 저장하거나 다른 곳으로 보내지 않는다.
  var q = location.search;
  if (q && q.indexOf('state=') !== -1) {
    location.replace('http://127.0.0.1:3001/api/oauth/callback' + q);
  } else {
    document.getElementById('msg').textContent = '이 주소는 직접 여는 곳이 아니에요. OmniPost 프로그램이 알려 주는 연결 주소를 여세요.';
  }
</script>
</body>
</html>
